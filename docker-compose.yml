services:
  nginx:
    build:
      context: .
      dockerfile: ./app/nginx/Dockerfile
      args:
        NGINX_CONF: app/nginx/prod.conf
    restart: unless-stopped

  # No ports are exposed so we can use a private instance to check for broken
  # links. All scripts are executed within a container.
  nginx-test:
    build:
      context: .
      dockerfile: ./app/nginx/Dockerfile

  nginx-dev:
    build:
      context: .
      dockerfile: ./app/nginx/Dockerfile
    ports:
      - "80:80"
    volumes:
      - ./build:/usr/share/nginx/html
    restart: unless-stopped

  sync:
    build: ./app/s3
    container_name: press-sync
    entrypoint: ["/app/bin/sync"]
    environment:
      S3_BUCKET_PATH: ${S3_BUCKET_PATH:-s3://press}
      S3CFG_PATH: ${S3CFG_PATH:-/root/.s3cfg}
    volumes:
      - ../s3:/s3

  seed:
    build: ./app/s3
    container_name: press-seed
    entrypoint: ["/app/bin/seed"]
    environment:
      S3_BUCKET_PATH: ${S3_BUCKET_PATH:-s3://press}
      S3CFG_PATH: ${S3CFG_PATH:-/root/.s3cfg}
    volumes:
      - ../s3:/s3

  webp:
    build: ./app/webp
    container_name: press-webp
    entrypoint: ["/app/bin/service"]
    volumes:
      - ./app/webp/input:/app/input
      - ./app/webp/output:/app/output
      - ../log:/app/log

  mermaid:
    image: minlag/mermaid-cli
    container_name: press-mermaid
    volumes:
      - ./:/data

  # Default port is 6379. Not exposed to the host to avoid port conflicts.
  # You can run redis-cli within this container.
  #   docker compose exec dragonfly redis-cli
  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly
    # Useful in avoiding conflicts from multiple active instances of press projects.
    container_name: press-dragonfly


  shell:
    image: press-shell
    build: ./app/shell
    container_name: press-shell
    working_dir: /data
    entrypoint: ["bash"]
    environment:
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      REDIS_HOST: dragonfly
      REDIS_PORT: 6379
      TEST_HOST_URL: ${TEST_HOST_URL:-http://nginx-test}
      BASE_URL: ${BASE_URL:-http://press.io}
    volumes:
      - ./:/data
      - ./app/shell/bin:/app/bin
      - ./app/shell/py/pie/pie:/press/py/pie/pie
      - ./app/shell/py/pie/tests:/press/py/pie/tests
      - ./src/templates/:/press/templates/

  release:
    image: press-release
    build:
      context: .
      dockerfile: ./app/release/Dockerfile
    depends_on:
      - shell

  pdoc:
    build:
      context: .
      dockerfile: ./app/pdoc/Dockerfile
    command: pdoc -h 0.0.0.0 -p 8080
    ports:
      - "8080:8080"
    volumes:
      - ./app/shell/py/pie:/pie
    profiles: ["pdoc"]

  analytics-db:
    build: ./app/analytics-db
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - analytics_data:/var/lib/postgresql/data

  analytics-backend:
    build: ./app/analytics-backend
    environment:
      DATABASE_HOST: analytics-db
      DATABASE_PORT: 5432
      DATABASE_USER: analytics
      DATABASE_PASSWORD: analytics
      DATABASE_NAME: analytics
      CORS_ALLOW_ORIGINS: http://localhost:5173,http://localhost:4173
    depends_on:
      - analytics-db
    ports:
      - "8001:8000"
    volumes:
      - ./app/analytics-backend:/app

  flashoffer:
    build:
      context: .
      dockerfile: ./app/flashoffer/Dockerfile
      target: runner
    environment:
      PORT: ${FLASHOFFER_PORT:-4173}
      VITE_FLASHOFFER_ANALYTICS_ENDPOINT: ${FLASHOFFER_ANALYTICS_ENDPOINT:-http://localhost:8001/events}
      VITE_FLASHOFFER_ANALYTICS_RECENT_URL: ${FLASHOFFER_ANALYTICS_RECENT_URL:-http://localhost:8001/events/recent}
    ports:
      - "${FLASHOFFER_PORT:-4173}:4173"
    volumes:
      - ./:/workspace

  flashoffer-dev:
    build:
      context: .
      dockerfile: ./app/flashoffer/Dockerfile.dev
    environment:
      FLASHOFFER_MODE: dev
      PORT: ${FLASHOFFER_DEV_PORT:-5173}
      CHOKIDAR_USEPOLLING: "true"
      VITE_FLASHOFFER_ANALYTICS_ENDPOINT: ${FLASHOFFER_ANALYTICS_ENDPOINT:-http://localhost:8001/events}
      VITE_FLASHOFFER_ANALYTICS_RECENT_URL: ${FLASHOFFER_ANALYTICS_RECENT_URL:-http://localhost:8001/events/recent}
    ports:
      - "${FLASHOFFER_DEV_PORT:-5173}:5173"
    volumes:
      - ./:/workspace
    depends_on:
      - analytics-backend

volumes:
  analytics_data:
