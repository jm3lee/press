services:
  analytics-db:
    build:
      context: .
      dockerfile: ./app/flashoffer/analytics-db/Dockerfile
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: analytics
    ports:
      - "5433:5432"
    volumes:
      - analytics_data:/var/lib/postgresql/data

  analytics-backend:
    build:
      context: .
      dockerfile: ./app/flashoffer/analytics-backend/Dockerfile
    environment:
      DATABASE_HOST: analytics-db
      DATABASE_PORT: 5432
      DATABASE_USER: analytics
      DATABASE_PASSWORD: analytics
      DATABASE_NAME: analytics
      CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost:5173,http://localhost:4173,http://localhost:10000}
    depends_on:
      - analytics-db
    ports:
      - "8001:8000"
    volumes:
      - ./app/flashoffer/analytics-backend:/app

volumes:
  analytics_data:
