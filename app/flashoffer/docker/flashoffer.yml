services:
  flashoffer:
    build:
      context: .
      dockerfile: ./app/flashoffer/flashoffer-demo/Dockerfile
      target: production
    environment:
      PORT: ${FLASHOFFER_PORT:-4173}
      VITE_FLASHOFFER_ANALYTICS_ENDPOINT: ${FLASHOFFER_ANALYTICS_ENDPOINT:-http://localhost:8001/events}
      VITE_FLASHOFFER_ANALYTICS_RECENT_URL: ${FLASHOFFER_ANALYTICS_RECENT_URL:-http://localhost:8001/events/recent}
      VITE_FLASHOFFER_QUIZ_API_BASE: ${FLASHOFFER_QUIZ_API_BASE:-http://localhost:8002}
      VITE_FLASHOFFER_CAMPAIGN_API_BASE: ${FLASHOFFER_CAMPAIGN_API_BASE:-http://localhost:8003}
    ports:
      - "${FLASHOFFER_PORT:-4173}:4173"
      - "80:80"
    volumes:
      - ./:/workspace
    depends_on:
      - analytics-backend
      - quiz-backend
      - campaign-backend

  flashoffer-dev:
    build:
      context: .
      dockerfile: ./app/flashoffer/flashoffer-demo/Dockerfile
      target: runner
    environment:
      FLASHOFFER_MODE: dev
      PORT: ${FLASHOFFER_DEV_PORT:-5173}
      CHOKIDAR_USEPOLLING: "true"
      VITE_FLASHOFFER_ANALYTICS_ENDPOINT: ${FLASHOFFER_ANALYTICS_ENDPOINT:-http://localhost:8001/events}
      VITE_FLASHOFFER_ANALYTICS_RECENT_URL: ${FLASHOFFER_ANALYTICS_RECENT_URL:-http://localhost:8001/events/recent}
      VITE_FLASHOFFER_QUIZ_API_BASE: ${FLASHOFFER_QUIZ_API_BASE:-http://quiz-backend:8000}
      VITE_FLASHOFFER_CAMPAIGN_API_BASE: ${FLASHOFFER_CAMPAIGN_API_BASE:-http://campaign-backend:8000}
    ports:
      - "${FLASHOFFER_DEV_PORT:-5173}:5173"
    volumes:
      - ./:/workspace
    depends_on:
      - analytics-backend
      - quiz-backend
      - campaign-backend
